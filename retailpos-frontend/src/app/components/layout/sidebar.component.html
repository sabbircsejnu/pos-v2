<aside
  id="app-sidebar"
  class="rp-sidebar"
  aria-label="Application sidebar"
  [class.rp-sidebar--open]="menuService.mobileSidebarOpen()"
  [class.rp-sidebar--collapsed]="menuService.sidebarCollapsed()"
  [class.sidebar-density-comfortable]="menuService.sidebarDensity() === 'comfortable'"
  [class.sidebar-density-compact]="menuService.sidebarDensity() === 'compact'"
  (keydown.escape)="menuService.closeMobileSidebar()">
  <header class="rp-sidebar__brand">
    <div class="rp-brand">
      <span class="rp-brand__mark" aria-hidden="true">
        <i class="fas fa-layer-group"></i>
      </span>
      <span class="rp-brand__text rp-label">
        <span class="rp-brand__name">RetailPOS</span>
        <span class="rp-brand__sub">ERP Workspace</span>
      </span>
    </div>
    <button
      type="button"
      class="rp-sidebar__close"
      (click)="menuService.closeMobileSidebar()"
      aria-label="Close navigation menu"
      title="Close navigation menu">
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
  </header>


  <nav class="rp-sidebar__nav" aria-label="Main navigation">
    @for (section of sections; track section.id) {
      <section class="rp-nav-section">
        <button
          type="button"
          class="rp-nav-caption"
          (click)="toggleGroup(section.id)"
          [attr.aria-expanded]="!isGroupCollapsed(section.id)"
          [attr.aria-controls]="'nav-group-' + section.id">
          <span class="rp-nav-caption__text">{{ formatSectionLabel(section.label) }}</span>
          <i class="fas fa-chevron-down rp-nav-caption__chevron" aria-hidden="true"></i>
        </button>

        <ul
          class="rp-nav-list"
          [id]="'nav-group-' + section.id"
          [class.rp-nav-list--collapsed]="isGroupCollapsed(section.id)">
          @for (item of section.items; track item.id) {
            <li>
              @if (item.children?.length) {
                <button
                  type="button"
                  class="rp-nav-item rp-nav-item--group"
                  (click)="toggleSubGroup(item.id)"
                  [title]="item.label"
                  [attr.aria-label]="item.label"
                  [attr.aria-expanded]="!isSubGroupCollapsed(item.id)"
                  [attr.aria-controls]="'nav-subgroup-' + item.id"
                  [class.rp-nav-item--group-active]="isSubGroupActive(item)">
                  <span class="rp-nav-item__icon" aria-hidden="true">
                    <i [class]="item.icon"></i>
                  </span>
                  <span class="rp-nav-item__label rp-label">{{ item.label }}</span>
                  <i class="fas fa-chevron-down rp-nav-item__chevron rp-label" aria-hidden="true"></i>
                </button>
                <ul
                  class="rp-nav-list rp-nav-sublist"
                  [id]="'nav-subgroup-' + item.id"
                  [class.rp-nav-list--collapsed]="isSubGroupCollapsed(item.id)">
                  @for (child of item.children; track child.id) {
                    <li>
                      <ng-container *ngTemplateOutlet="navLeaf; context: { $implicit: child, nested: true }" />
                    </li>
                  }
                </ul>
              } @else {
                <ng-container *ngTemplateOutlet="navLeaf; context: { $implicit: item, nested: false }" />
              }
            </li>
          }
        </ul>
      </section>
    }
  </nav>
</aside>

<ng-template #navLeaf let-item let-nested="nested">
  <button
    type="button"
    class="rp-nav-item"
    (click)="navigateToItem(item)"
    [disabled]="item.disabled"
    [title]="item.label"
    [attr.aria-label]="item.label"
    [attr.aria-current]="isItemActive(item) ? 'page' : null"
    [class.rp-nav-item--nested]="nested"
    [class.rp-nav-item--active]="isItemActive(item)">
    <span class="rp-nav-item__icon" aria-hidden="true">
      <i [class]="item.icon"></i>
    </span>
    <span class="rp-nav-item__label rp-label">{{ item.label }}</span>
    @if (item.disabled) {
      <span class="rp-nav-item__badge rp-label">Soon</span>
    }
  </button>
</ng-template>

@if (menuService.mobileSidebarOpen()) {
  <div
    class="rp-sidebar-backdrop"
    aria-hidden="true"
    (click)="menuService.closeMobileSidebar()"></div>
}
