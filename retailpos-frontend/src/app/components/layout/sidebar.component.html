<!-- Sidebar -->
<aside
  [class.translate-x-0]="menuService.sidebarOpen()"
  [class.-translate-x-full]="!menuService.sidebarOpen()"
  class="fixed left-0 top-14 h-[calc(100vh-3.5rem)] w-56 bg-white border-r border-gray-200 transform transition-transform duration-200 ease-in-out z-40 overflow-y-auto scrollbar-thin"
>
  @if (activeParentMenu) {
    <!-- Sidebar Header -->
    <div class="bg-gray-900 text-white px-4 py-3 sticky top-0 z-10 border-b border-gray-800">
      <div class="flex items-center space-x-2.5">
        <div class="p-1.5 bg-white/10 rounded">
          <i [class]="activeParentMenu.icon" class="text-base"></i>
        </div>
        <div>
          <h2 class="font-semibold text-sm">{{ activeParentMenu.label }}</h2>
          <p class="text-xs text-gray-400">{{ childMenuItems.length }} items</p>
        </div>
      </div>
    </div>

    <!-- Child Menu Items -->
    <nav class="py-1">
      @for (child of childMenuItems; track child.id) {
        <a
          [routerLink]="child.route"
          routerLinkActive="bg-gray-100 text-gray-900 border-l-3 border-gray-900 font-semibold"
          class="flex items-center space-x-2.5 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors border-l-3 border-transparent"
        >
          <i [class]="child.icon" class="text-sm text-gray-500"></i>
          <span class="font-medium">{{ child.label }}</span>
        </a>
      }
    </nav>

    <!-- Sidebar Footer -->
    <div class="absolute bottom-0 left-0 right-0 bg-gray-50 px-4 py-3 border-t border-gray-200">
      <div class="text-xs text-gray-500 text-center flex items-center justify-center gap-1.5">
        <i class="fas fa-info-circle text-gray-400"></i>
        <span>Click items to navigate</span>
      </div>
    </div>
  } @else {
    <!-- No Parent Menu Selected -->
    <div class="flex flex-col items-center justify-center h-full px-6 text-center">
      <div class="p-5 bg-gray-100 rounded-lg mb-3">
        <i class="fas fa-arrow-up text-4xl text-gray-300"></i>
      </div>
      <h3 class="text-base font-semibold text-gray-700 mb-1">Select a Menu</h3>
      <p class="text-xs text-gray-500">Choose a menu from the top bar</p>
    </div>
  }
</aside>

<!-- Overlay for mobile -->
@if (menuService.sidebarOpen()) {
  <div
    (click)="menuService.toggleSidebar()"
    class="fixed inset-0 bg-black/40 z-30 lg:hidden top-14"
  ></div>
}
