<div class="container mx-auto px-4 py-4 ui-form-stack" data-density="compact">
  <app-ui-page-header
    title="Discount limit"
    description="Business-wide cap for manual discounts applied at the point of sale."
    [breadcrumbs]="breadcrumbs" />

  @if (loadError()) {
    <app-ui-state kind="error" title="Discount limit could not be loaded" [message]="loadError()!">
      <button appUiButton type="button" variant="outline" (click)="load()">Retry</button>
    </app-ui-state>
  } @else {
    <app-ui-card title="Manual discounts" [loading]="isLoading()">
      @if (saveError()) {
        <app-ui-alert variant="danger" title="Discount limit not saved">{{ saveError() }}</app-ui-alert>
      }

      <form id="pos-discount-form" class="ui-form-stack" (ngSubmit)="save()" novalidate>
        <app-ui-form-field
          label="Maximum manual discount (%)"
          hint="0 disables manual discounts. Users with the “Override discount limit” permission (sales.discount.override_limit) can exceed this limit."
          [required]="true"
          [error]="error()">
          <input appUiControl type="number" name="maxManualDiscountPercent" min="0" max="100" step="0.01"
            [ngModel]="maxManualDiscountPercent()"
            (ngModelChange)="update($event)" />
        </app-ui-form-field>
      </form>

      <div uiCardFooter>
        <button appUiButton type="submit" form="pos-discount-form" [loading]="isSaving()" [disabled]="isLoading()">
          <i class="fas fa-save" aria-hidden="true"></i>
          <span>{{ isSaving() ? 'Saving...' : 'Save discount limit' }}</span>
        </button>
      </div>
    </app-ui-card>
  }
</div>
