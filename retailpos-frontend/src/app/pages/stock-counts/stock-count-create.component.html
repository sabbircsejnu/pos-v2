<div class="container mx-auto px-4 py-4">
  <div class="flex items-center justify-between mb-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Create Stock Count</h1>
      <p class="text-sm text-gray-600 mt-0.5">Generate immutable stock snapshot lines for physical counting</p>
    </div>
    <button (click)="goBack()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition text-sm">
      <i class="fas fa-arrow-left mr-2"></i>
      Back
    </button>
  </div>

  @if (isLoading()) {
    <div class="bg-white rounded-lg shadow-md p-10 text-center">
      <i class="fas fa-spinner fa-spin text-3xl text-gray-400 mb-3"></i>
      <p class="text-sm text-gray-600">Loading location access...</p>
    </div>
  } @else {
    <div class="bg-white rounded-lg shadow-md p-6 max-w-3xl">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Location Type</label>
          <select
            [ngModel]="locationType()"
            (ngModelChange)="onLocationTypeChange($event)"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg"
            [disabled]="!canSelectAnyLocation()"
          >
            <option value="outlet">Outlet</option>
            <option value="warehouse">Warehouse</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
          <select
            [ngModel]="locationId()"
            (ngModelChange)="locationId.set($event)"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg"
            [disabled]="!canSelectAnyLocation()"
          >
            <option [ngValue]="null">Select location</option>
            @for (loc of getLocations(); track loc.id) {
              <option [ngValue]="loc.id">{{ loc.name }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Stock Count Date</label>
          <input
            type="date"
            [ngModel]="stockCountDate()"
            (ngModelChange)="stockCountDate.set($event)"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg"
          />
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Remarks (Optional)</label>
          <textarea
            [ngModel]="remarks()"
            (ngModelChange)="remarks.set($event)"
            rows="3"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg"
            placeholder="Monthly stock count / notes"
          ></textarea>
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 mt-6">
        <button (click)="goBack()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
          Cancel
        </button>
        <button (click)="submit()" [disabled]="isSubmitting()" class="px-5 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 disabled:opacity-50 transition">
          @if (isSubmitting()) {
            <i class="fas fa-spinner fa-spin mr-2"></i>
          }
          Generate Snapshot
        </button>
      </div>
    </div>
  }
</div>
