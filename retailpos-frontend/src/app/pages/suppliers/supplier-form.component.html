<div class="container mx-auto px-4 py-6 max-w-2xl">
  <div class="bg-white rounded-lg shadow-md p-6">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">
      {{ isEditMode() ? 'Edit Supplier' : 'Create Supplier' }}
    </h1>

    <!-- Loading State -->
    <div *ngIf="isLoading()" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      <p class="mt-4 text-gray-600">Loading supplier...</p>
    </div>

    <!-- Form -->
    <form *ngIf="!isLoading()" [formGroup]="supplierForm" (ngSubmit)="onSubmit()">
      <!-- Name -->
      <div class="mb-4">
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
          Supplier Name <span class="text-red-600">*</span>
        </label>
        <input
          type="text"
          id="name"
          formControlName="name"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          [class.border-red-500]="isFieldInvalid('name')"
          placeholder="Enter supplier name"
        />
        <p *ngIf="isFieldInvalid('name')" class="mt-1 text-sm text-red-600">
          {{ getErrorMessage('name') }}
        </p>
      </div>

      <!-- Contact -->
      <div class="mb-4">
        <label for="contact" class="block text-sm font-medium text-gray-700 mb-1">
          Contact
        </label>
        <input
          type="text"
          id="contact"
          formControlName="contact"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          [class.border-red-500]="isFieldInvalid('contact')"
          placeholder="Phone, email, or contact person"
        />
        <p *ngIf="isFieldInvalid('contact')" class="mt-1 text-sm text-red-600">
          {{ getErrorMessage('contact') }}
        </p>
      </div>

      <!-- Address -->
      <div class="mb-4">
        <label for="address" class="block text-sm font-medium text-gray-700 mb-1">
          Address
        </label>
        <textarea
          id="address"
          formControlName="address"
          rows="3"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          [class.border-red-500]="isFieldInvalid('address')"
          placeholder="Enter supplier address"
        ></textarea>
        <p *ngIf="isFieldInvalid('address')" class="mt-1 text-sm text-red-600">
          {{ getErrorMessage('address') }}
        </p>
      </div>

      <!-- Credit Limit -->
      <div class="mb-6">
        <label for="creditLimit" class="block text-sm font-medium text-gray-700 mb-1">
          Credit Limit <span class="text-red-600">*</span>
        </label>
        <input
          type="number"
          id="creditLimit"
          formControlName="creditLimit"
          min="0"
          step="0.01"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          [class.border-red-500]="isFieldInvalid('creditLimit')"
          placeholder="0.00"
        />
        <p *ngIf="isFieldInvalid('creditLimit')" class="mt-1 text-sm text-red-600">
          {{ getErrorMessage('creditLimit') }}
        </p>
        <p class="mt-1 text-sm text-gray-500">
          Maximum credit amount allowed for this supplier
        </p>
      </div>

      <!-- Form Actions -->
      <div class="flex gap-4 justify-end">
        <button
          type="button"
          (click)="onCancel()"
          [disabled]="isSubmitting()"
          class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition duration-200"
          [class.opacity-50]="isSubmitting()"
          [class.cursor-not-allowed]="isSubmitting()"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="isSubmitting()"
          class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition duration-200 flex items-center gap-2"
          [class.opacity-50]="isSubmitting()"
          [class.cursor-not-allowed]="isSubmitting()"
        >
          <span *ngIf="isSubmitting()" class="inline-block animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
          <span>{{ isEditMode() ? 'Update' : 'Create' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
