name: Flutter Mobile

on:
  pull_request:
    paths:
      - "retailpos-mobile/**"
      - ".github/workflows/flutter-mobile.yml"
  push:
    paths:
      - "retailpos-mobile/**"
      - ".github/workflows/flutter-mobile.yml"
  workflow_dispatch:

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retailpos-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Install pinned Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Verify Flutter and Dart versions
        run: |
          flutter --version --machine | jq -e \
            '.frameworkVersion == "3.47.7" and
             .frameworkRevision == "abaf9c523780a608bd46686fd5e53740a07077f8" and
             .dartSdkVersion == "3.13.5"'
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build development Android APK
        run: flutter build apk --debug --flavor development --dart-define=APP_ENV=development
      - name: Build staging Android APK
        run: flutter build apk --debug --flavor staging --dart-define=APP_ENV=staging
