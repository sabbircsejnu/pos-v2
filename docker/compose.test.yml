name: iranimart-test
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-postgres}
      POSTGRES_USER: ${TEST_POSTGRES_USER:?Set TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set TEST_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    shm_size: 256mb
    networks: [test_net]
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: "no"
    environment:
      RABBITMQ_DEFAULT_USER: ${TEST_RABBITMQ_USER:?Set TEST_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${TEST_RABBITMQ_PASSWORD:?Set TEST_RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${TEST_RABBITMQ_VHOST:-retailpos_test}
    ports:
      - "127.0.0.1:${TEST_RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${TEST_RABBITMQ_MGMT_PORT:-15673}:15672"
    volumes:
      - rabbitmq_test_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [test_net]
  redis:
    image: redis:6.2-alpine
    restart: "no"
    environment:
      REDISCLI_AUTH: ${TEST_REDIS_PASSWORD:?Set TEST_REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDISCLI_AUTH\""]
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-6383}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [test_net]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    restart: "no"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${TEST_ELASTIC_PASSWORD:?Set TEST_ELASTIC_PASSWORD}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${TEST_ELASTIC_PORT:-9201}:9200"
    volumes:
      - elastic_test_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"elastic:$$ELASTIC_PASSWORD\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 40s
    networks: [test_net]
volumes:
  postgres_test_data:
  rabbitmq_test_data:
  elastic_test_data:
networks:
  test_net:
    driver: bridge
